<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="北京高中班级新媒体工作台：选题、成稿、口播、封面和发布清单。纯前端本地生成，不登录、不发布到平台。" />
<meta name="theme-color" content="#f6f1e8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23c2410c'/%3E%3C/svg%3E" />
<title>北京高中班级新媒体工作台</title>
<style>
:root{--bg:#f6f1e8;--ink:#2a241c;--muted:#7a7167;--line:#eadfce;--accent:#c2410c;--soft:#fff1e6;--card:#fff;--shadow:0 10px 28px rgba(90,58,32,.06);--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Micro Hei","Droid Sans Fallback",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(900px 420px at 100% -10%,#ffe8d2 0%,transparent 55%),var(--bg);font-size:16px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#side{position:fixed;inset:0 auto 0 0;width:228px;background:#f3eadf;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 12px;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.seal{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.brand h1{font-size:1rem;margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.75rem}
#nav{display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px;color:inherit}
.nav.active{background:#fff;color:var(--accent);font-weight:600}
.ic{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--soft);color:var(--accent);border-radius:99px;padding:1px 6px;font-size:.75rem}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:rgba(255,255,255,.6);border-radius:14px;padding:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.foot small{display:block;color:var(--muted);font-size:.75rem}
.main{margin-left:228px;min-height:100vh}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;position:sticky;top:0;background:rgba(246,241,232,.94);z-index:20;border-bottom:1px solid rgba(234,223,206,.9)}
#crumb{font-weight:700}
.grow{flex:1}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px}
#newBtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:8px}
.who{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mask{display:none;position:fixed;inset:0;border:0;background:rgba(42,36,28,.4);z-index:25}
#view{width:min(920px,calc(100% - 28px));margin:0 auto;padding:14px 0 48px}
#view, .body, .out-title, .cardbtn, .jump, .lib, .banner, h2, h3, p, .hint, .lead{overflow-wrap:anywhere}
h2{margin:0 0 8px;font-size:1.35rem}
.lead{color:var(--muted);margin:0 0 12px}
.hero-title{text-align:center;font-size:clamp(1.35rem,2.4vw,1.8rem);margin:0 0 8px}
.hero-sub{text-align:center;color:var(--muted);margin:0 0 14px}
.composer,.result,.lib,details.pack,details.tool{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.composer{padding:18px 16px 14px}
.result{border-left:4px solid var(--accent);padding:14px;margin-top:14px}
.label{font-size:.8rem;color:var(--muted);margin:8px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
textarea,input[type="text"],input[type="search"]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:#fdba74;box-shadow:0 0 0 3px rgba(194,65,12,.15)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600}
.primary:disabled{opacity:.55;cursor:wait}
.ghost{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.tiny{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:.82rem}
.hint{color:var(--muted);font-size:.85rem}
.sec{margin:22px 0 10px;font-size:1rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.tpl{border:0;border-radius:16px;min-height:108px;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.tpl b{font-size:.95rem}.tpl span{font-size:.78rem;color:#5c5348}
.jump,.cardbtn{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;color:inherit}
.jump b,.cardbtn strong{display:block}
.jump span,.cardbtn span,.cardbtn em{display:block;color:var(--muted);font-size:.8rem;font-style:normal;margin-top:3px}
.cardbtn .k{color:var(--accent);font-weight:600;font-size:.8rem}
.banner{background:var(--soft);border:1px solid #f3d2bc;color:#7c3f1d;border-radius:14px;padding:12px 14px;line-height:1.6;margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag,.pill{background:#f5f0e8;border-radius:8px;padding:3px 8px;font-size:.78rem}
.pill{background:var(--soft);color:#9a3412}
.body{white-space:pre-wrap;line-height:1.75}
.extra{color:#44403c;font-size:.92rem}
.frame{width:min(100%,320px);margin-top:8px}
.frame.sm{width:min(100%,200px)}
.frame canvas{width:100%;height:auto;border-radius:16px;display:block;box-shadow:var(--shadow)}
.lib{padding:12px;margin:8px 0}
.lib p{margin:6px 0;white-space:pre-wrap}
details.pack,details.tool{padding:10px 12px;margin:8px 0}
details summary{cursor:pointer;font-weight:600}
.pack .body{max-height:240px;overflow:auto;background:#fbf7f2;border-radius:10px;padding:8px 10px}
.check{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.check input{margin-top:4px;width:16px;height:16px}
.foot-note{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a241c;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
body.nav-open{overflow:hidden}
#side{transition:left .2s ease}
@media (max-width:860px){
  #side{left:-280px}
  #side.open{left:0}
  .main{margin-left:0}
  #menuBtn{display:inline-block}
  #mask.show{display:block}
}
body.is-mobile #side{left:-280px}
body.is-mobile #side.open{left:0}
body.is-mobile .main{margin-left:0}
body.is-mobile #menuBtn{display:inline-block}
body.is-mobile #mask.show{display:block}
@media (max-width:720px){.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

      <div class="seal" aria-hidden="true">班</div>

      <button type="button" class="nav" data-go="account"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="9" r="3"/><path d="M6.5 19c1.2-2.5 3-3.6 5.5-3.6s4.3 1.1 5.5 3.6"/></svg><span>账号空间</span></button>
      <button type="button" class="nav" data-go="tools"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14.5 6.2a3 3 0 0 0-4 3.6L5 15.2 8.8 19l5.4-5.3a3 3 0 0 0 3.5-4.2L15.2 11 13 8.8z"/></svg><span>工具&技能</span></button>

    <button type="button" class="foot" data-go="account" id="footBtn">
      <span class="avatar" id="avatar">班</span>
      <span><strong id="footName">未填写班级</strong><small id="footMeta">本地账号</small></span>
    </button>
  </aside>
  <button type="button" id="mask" data-act="closemenu" aria-label="关闭导航"></button>
  <div class="main">
    <header class="bar">
      <button type="button" id="menuBtn" data-act="menu">菜单</button>
      <strong id="crumb">创作台</strong>
      <span class="grow"></span>
      <button type="button" id="newBtn" data-act="fresh">新对话</button>
      <button type="button" class="who" id="who" data-go="account">设置班级</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

function h(tag, attrs, kids) {
  const n = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(k => {
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v;
    else n.setAttribute(k, v === true ? '' : String(v));
  });
  const list = Array.isArray(kids) ? kids : (kids == null ? [] : [kids]);
  list.forEach(kid => {
    if (kid == null || kid === false) return;
    n.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return n;
}

function localGet(key, fallback) {

function loadProfile() {

  if (!Array.isArray(p.platforms)) p.platforms = ['mp'];
  p.platforms = p.platforms.filter(id => known(PLATS, id));
  if (!p.platforms.length) p.platforms = ['mp'];
  if (!known(GRADES, p.grade)) p.grade = 'g1';
  p.className = String(p.className || '').slice(0, 24);
  p.voice = typeof saved.voice === 'string' ? saved.voice.slice(0, 240) : DEFAULT_PROFILE.voice;

function restoreSession() {
  let data = null;
  try { data = JSON.parse(sessionStorage.getItem('bjcm-session-v1') || 'null'); } catch (e) { data = null; }
  if (!data || typeof data !== 'object') return;
  if (known(GRADES, data.grade)) state.grade = data.grade;
  if (known(PLATS, data.platform)) state.platform = data.platform;
  if (known(MODES, data.mode)) state.mode = data.mode;
  if (typeof data.topic === 'string') state.topic = data.topic.slice(0, 600);
  if (data.article && typeof data.article.title === 'string' && typeof data.article.body === 'string') state.article = data.article;
  if (data.cover && typeof data.cover === 'object') {
    state.cover = Object.assign(defaultCover(), data.cover);
    if (!known(GRADES, state.cover.grade)) state.cover.grade = 'g1';
    if (!known(PLATS, state.cover.platform)) state.cover.platform = 'mp';
  }
  if (known(GRADES, data.wGrade)) state.wGrade = data.wGrade;

function copyText(text, ok) {
  if (!text) { toast('没有可复制的内容'); return; }
  const done = () => toast(ok || '已复制');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { toast('复制失败，请手动选择文本'); }
  ta.remove();
}

function roundRect(ctx, x, y, w, h, r) {

  ctx.moveTo(x + radius, y);

  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);

}

    const next = line + ch;

function paint(canvas) {
  const W = 1080, H = 1440;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const grade = known(GRADES, state.cover.grade) ? state.cover.grade : 'g1';
  const plat = known(PLATS, state.cover.platform) ? state.cover.platform : 'mp';
  const title = (state.cover.title || '').trim() || '班级这一周';
  const sub = (state.cover.sub || '').trim();
  const badge = clip((state.cover.badge || '').trim() || '班级记录', 8);
  ctx.fillStyle = '#fbf6ef';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = WASH[grade] || WASH.g1;
  ctx.fillRect(0, 0, W, 820);
  ctx.fillStyle = 'rgba(255,250,244,.35)';
  ctx.beginPath();
  ctx.arc(900, 180, 180, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = STRIPE[plat] || '#c2410c';
  ctx.fillRect(0, 0, W, 32);
  ctx.font = '600 32px ' + FONT;
  const bw = Math.ceil(ctx.measureText(badge).width + 56);
  roundRect(ctx, 80, 88, bw, 60, 30);
  ctx.fillStyle = '#2a241c';
  ctx.fill();
  ctx.fillStyle = '#fffaf4';
  ctx.textBaseline = 'middle';
  ctx.fillText(badge, 108, 118);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#2a241c';
  ctx.font = '600 40px ' + FONT;
  ctx.fillText(gradeName(grade) + '  ·  ' + platName(plat), 80, 230);
  const n = Array.from(title).length;
  const size = n <= 8 ? 76 : n <= 14 ? 64 : 52;
  ctx.font = '700 ' + size + 'px ' + FONT;
  const all = wrapText(ctx, title, W - 160);
  const lines = all.slice(0, 3);
  if (all.length > 3 && lines[2]) lines[2] = clip(lines[2], Math.max(1, Array.from(lines[2]).length - 1)) + '…';
  let y = lines.length === 1 ? 1040 : 960;
  lines.forEach(ln => { ctx.fillText(ln, 80, y); y += size + 18; });
  ctx.fillStyle = '#5c5348';
  ctx.font = '500 34px ' + FONT;
  y += 12;
  wrapText(ctx, sub, W - 160).slice(0, 2).forEach(ln => { ctx.fillText(ln, 80, y); y += 48; });
  ctx.fillStyle = STRIPE[plat] || '#c2410c';
  ctx.fillRect(80, H - 120, 84, 8);
  ctx.fillStyle = '#6e655c';
  ctx.font = '500 28px ' + FONT;
  ctx.fillText('北京高中 · 班级新媒体', 80, H - 64);
}

  return '【平台】' + pk.plat.label + '\n【标题】' + pk.article.title + '\n【正文】\n' + pk.article.body + '\n【标签】' + pk.article.tags + '\n【封面提示】' + pk.article.cover;
}
function renderPublish() {
  if (!state.article) {
    document.getElementById('view').innerHTML =
      '<h2 id="viewTitle" tabindex="-1">发布中心</h2>' +
      '<div class="banner">还没有草稿。先在创作台生成一篇，再来整理文案包。这里不会真正发布。</div>' +
      '<button type="button" class="primary" data-go="chat">去创作台</button>' + footHTML();
    return;
  }
  const packs = makePacks();
  const map = state.checks[checkKey()] || {};
  const done = CHECKS.filter(c => map[c[0]]).length;
  const list = CHECKS.map(c =>
    '<label class="check"><input type="checkbox" data-check="' + c[0] + '"' + (map[c[0]] ? ' checked' : '') + '><span>' + esc(c[1]) + '</span></label>'
  ).join('');
  const blocks = packs.map(pk => {
    const open = pk.plat.id === state.article.platform ? ' open' : '';
    return '<details class="pack"' + open + '><summary>' + esc(pk.plat.label) + ' · ' + esc(clip(pk.article.title, 28)) + '</summary>' +
      '<p><b>标题</b><br>' + esc(pk.article.title) + '</p>' +
      '<p><b>正文</b></p><div class="body">' + esc(pk.article.body) + '</div>' +
      '<p><b>标签</b> ' + esc(pk.article.tags) + '</p>' +
      '<p><b>封面提示</b> ' + esc(pk.article.cover) + '</p>' +
      '<div class="actions">' +
      '<button type="button" class="tiny" data-act="copypack" data-part="title" data-plat="' + pk.plat.id + '">复制标题</button>' +
      '<button type="button" class="tiny" data-act="copypack" data-part="body" data-plat="' + pk.plat.id + '">复制正文</button>' +
      '<button type="button" class="tiny" data-act="copypack" data-part="tags" data-plat="' + pk.plat.id + '">复制标签</button>' +
      '<button type="button" class="tiny" data-act="copypack" data-part="all" data-plat="' + pk.plat.id + '">复制此平台文案包</button>' +
      '</div><p class="hint">复制不等于已发布。</p></details>';
  }).join('');
  document.getElementById('view').innerHTML =
    '<h2 id="viewTitle" tabindex="-1">发布中心</h2>' +
    '<div class="banner">这里只整理文案和清单。复制之后，请人工审核，再由同学或老师自行到对应 App 发布。工作台不会真正发布，也没有平台接口。</div>' +
    '<p>基于当前草稿「' + esc(state.article.title) + '」，按同一选题给六个平台各出一版。</p>' +
    '<h3 class="sec">发布前清单 <span id="prog">已核对 ' + done + ' / ' + CHECKS.length + '</span></h3>' +
    '<p class="hint">勾选只保存在这台浏览器，方便你自己核对，不是审批流程。</p>' + list +
    '<div class="actions"><button type="button" class="primary" data-act="copypack" data-part="every">复制全部平台文案包</button></div>' +
    blocks + footHTML();
}
function renderAccount() {
  const p = state.draftProfile;
  document.getElementById('view').innerHTML =
    '<h2 id="viewTitle" tabindex="-1">账号空间</h2>' +
    '<p class="lead">这些内容只存在这台浏览器，用来当作新对话的默认值。没有登录。</p>' +
    '<form id="accForm">' +
    '<label class="label" for="accClass">班级名</label><input id="accClass" type="text" maxlength="24" placeholder="例如：高一（3）班">' +
    '<div class="label">默认年级</div>' + chipHTML(GRADES, p.grade, 'agrade') +
    '<div class="label">常用平台（可多选，新对话用第一个）</div>' + chipMulti(PLATS, p.platforms, 'aplat') +
    '<label class="label" for="accVoice">口吻备注</label><textarea id="accVoice" maxlength="240"></textarea>' +
    '<div class="actions"><button class="primary" type="submit">保存到本机</button><button type="button" class="ghost" data-act="resetprofile">恢复示例</button></div>' +
    '</form><p class="hint">保存后，点「新对话」会按这里的年级和第一个常用平台开始。换浏览器或清除站点数据后需要重填。</p>' + footHTML();
  document.getElementById('accClass').value = p.className || '';
  document.getElementById('accVoice').value = p.voice || '';
}
function renderTools() {
  const cards = TOOLS.map((t, i) =>
    '<details class="tool"' + (i === 0 ? ' open' : '') + '><summary>' + esc(t.title) + '</summary><ul>' +
    t.points.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul></details>'
  ).join('');
  document.getElementById('view').innerHTML =
    '<h2 id="viewTitle" tabindex="-1">工具&技能</h2>' +
    '<p class="lead">写选题、改一稿多发、对平台规范时可以翻的页内说明。不需要安装插件，也不会跳到别的产品。</p>' +
    cards + footHTML();
}
function updateChrome() {
  document.getElementById('crumb').textContent = CRUMB[state.view] || '创作台';
  document.title = '北京高中班级新媒体工作台 · ' + (CRUMB[state.view] || '');
  document.querySelectorAll('#nav [data-go]').forEach(btn => {
    const on = btn.dataset.go === state.view;
    btn.classList.toggle('active', on);
    if (on) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
  const name = ((state.profile && state.profile.className) || '').trim();
  document.getElementById('footName').textContent = name || '未填写班级';
  document.getElementById('footMeta').textContent = gradeName(state.grade) + ' · 只存在本机';
  document.getElementById('avatar').textContent = name ? Array.from(name)[0] : '班';
  document.getElementById('who').textContent = name || '设置班级';
  const badge = document.getElementById('libN');
  badge.textContent = state.drafts.length ? String(state.drafts.length) : '';
  badge.hidden = !state.drafts.length;
}
function render() {
  updateChrome();
  if (state.view === 'chat') return renderChat();
  if (state.view === 'workshop') return renderWorkshop();
  if (state.view === 'radar') return renderRadar();
  if (state.view === 'library') return renderLibrary();
  if (state.view === 'cover') return renderCover();
  if (state.view === 'publish') return renderPublish();
  if (state.view === 'account') return renderAccount();
  if (state.view === 'tools') return renderTools();
  state.view = 'chat';
  renderChat();
}
function closeMenu() {
  document.getElementById('side').classList.remove('open');
  document.getElementById('mask').classList.remove('show');
  document.body.classList.remove('nav-open');
}
function syncLayout() {
  const mobile = window.matchMedia('(max-width: 860px)').matches;
  document.body.classList.toggle('is-mobile', mobile);
  if (!mobile) closeMenu();
}
function toggleMenu() {
  if (!window.matchMedia('(max-width: 860px)').matches) return;
  const open = document.getElementById('side').classList.toggle('open');
  document.getElementById('mask').classList.toggle('show', open);
  document.body.classList.toggle('nav-open', open);
}
function applyView(view) {
  state.view = view;
  closeMenu();
  render();
  persistSession();
}
function showView(view, opts) {
  if (VIEWS.indexOf(view) < 0) view = 'chat';
  genToken++;
  state.busy = false;
  if (opts && opts.fresh) {
    state.topic = '';
    state.article = null;
    state.mode = 'note';
    state.grade = state.profile.grade || 'g1';
    state.platform = (state.profile.platforms && state.profile.platforms[0]) || 'mp';
    toast('已清空创作台，知识库里的草稿还在');
  }
  if (view === 'account' && state.view !== 'account') state.draftProfile = clone(state.profile);
  if (view === 'workshop' && state.view !== 'workshop' && !state.weekTouched) {
    state.wGrade = state.grade;
    state.wPlat = state.platform;
  }
  applyView(view);
}
function go(view, opts) {
  if (VIEWS.indexOf(view) < 0) view = 'chat';
  if (location.hash !== '#' + view) {
    suppressHash = true;
    location.hash = view;
    suppressHash = false;
  }
  showView(view, opts);
}
function onChoice(btn) {
  const key = btn.dataset.choice;
  const id = btn.dataset.id;
  if (key === 'grade' && known(GRADES, id)) state.grade = id;
  else if (key === 'platform' && known(PLATS, id)) state.platform = id;
  else if (key === 'mode' && known(MODES, id)) state.mode = id;
  else if (key === 'wgrade' && known(GRADES, id)) { state.wGrade = id; state.weekTouched = true; }
  else if (key === 'wplat' && known(PLATS, id)) { state.wPlat = id; state.weekTouched = true; }
  else if (key === 'cgrade' && known(GRADES, id)) state.cover.grade = id;
  else if (key === 'cplat' && known(PLATS, id)) state.cover.platform = id;
  else if (key === 'rgrade' && (id === 'all' || known(GRADES, id))) state.radar = id;
  else if (key === 'agrade' && known(GRADES, id)) state.draftProfile.grade = id;
  else if (key === 'aplat' && known(PLATS, id)) {
    const set = new Set(state.draftProfile.platforms);
    if (set.has(id)) {
      if (set.size === 1) { toast('至少留一个常用平台'); return; }
      set.delete(id);
    } else set.add(id);
    state.draftProfile.platforms = PLATS.map(p => p.id).filter(x => set.has(x));
  } else return;
  render();
  persistSession();
}
function generate() {
  const box = document.getElementById('topic');
  if (box) state.topic = box.value;
  const token = ++genToken;
  const snapshot = {topic: state.topic, grade: state.grade, platform: state.platform, mode: state.mode, profile: clone(state.profile)};
  state.busy = true;
  if (state.view === 'chat') render();
  setTimeout(() => {
    if (token !== genToken) return;
    state.article = buildArticle(snapshot);
    state.busy = false;
    fillCoverFrom(state.article);
    persistSession();
    if (state.view === 'chat') {
      render();
      const result = document.getElementById('result');
      if (result) result.scrollIntoView({block:'nearest'});
    } else toast('草稿已生成，回到创作台可查看');
  }, 350);
}
function saveDraft() {
  const a = state.article;
  if (!a) { toast('先生成一篇再保存'); return; }
  if (state.drafts.some(d => d.title === a.title && d.body === a.body)) { toast('知识库里已有相同草稿'); return; }
  state.drafts.unshift({
    id: uid(), at: Date.now(), topic: a.topic, grade: a.grade, platform: a.platform, mode: a.mode,
    title: a.title, body: a.body, tags: a.tags, cover: a.cover, coverTitle: a.coverTitle
  });
  state.drafts = state.drafts.slice(0, 40);
  localSet('bjcm-drafts-v1', state.drafts);
  updateChrome();
  toast('已存入知识库');
}
function openDraft(id) {
  const d = state.drafts.find(x => x.id === id);
  if (!d) return;
  state.topic = d.topic || '';
  if (known(GRADES, d.grade)) state.grade = d.grade;
  if (known(PLATS, d.platform)) state.platform = d.platform;
  if (known(MODES, d.mode)) state.mode = d.mode;
  state.article = {
    title: d.title, body: d.body, tags: d.tags || '', cover: d.cover || '',
    coverTitle: d.coverTitle || d.topic || '', topic: d.topic || '', grade: d.grade, platform: d.platform, mode: d.mode
  };
  fillCoverFrom(state.article);
  go('chat');
  toast('已在创作台打开');
}
function armDelete(btn, label) {
  if (btn.dataset.arm !== '1') {
    btn.dataset.arm = '1';
    btn.textContent = '确认删除';
    setTimeout(() => { if (btn.isConnected) { btn.dataset.arm = ''; btn.textContent = label; } }, 2200);
    return false;
  }
  return true;
}
function syncCover() {
  const box = document.getElementById('topic');
  if (box) state.topic = box.value;
  if (state.article) fillCoverFrom(state.article);
  else {
    state.cover.title = clip((state.topic || '').trim() || '班级这一周', 24);
    state.cover.sub = gradeName(state.grade) + ' · ' + classLabel() + ' · ' + platName(state.platform);
    state.cover.grade = state.grade;
    state.cover.platform = state.platform;
    state.cover.badge = state.cover.badge || '班级记录';
  }
  if (state.view === 'cover') { render(); toast('已按当前内容填好封面'); persistSession(); }
  else go('cover');
}
function downloadCover() {
  drawAll();
  const canvas = document.getElementById('coverCanvas') || document.querySelector('canvas.cover-canvas');
  if (!canvas) { toast('请先打开做配图'); return; }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = '班级封面-' + ((state.cover.title || '封面').replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 40)) + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('已下载 PNG');
}
function copyPack(part, plat) {
  const packs = makePacks();
  if (!packs.length) { toast('先生成一篇草稿'); return; }
  if (part === 'every') { copyText(packs.map(packText).join('\n\n--------\n\n'), '已复制全部文案包'); return; }
  const pk = packs.find(p => p.plat.id === plat);
  if (!pk) return;
  if (part === 'all') copyText(packText(pk), '已复制' + pk.plat.label + '文案包');
  else if (part === 'title') copyText(pk.article.title, '已复制标题');
  else if (part === 'body') copyText(pk.article.body, '已复制正文');
  else if (part === 'tags') copyText(pk.article.tags, '已复制标签');
}
function saveProfile() {
  const p = state.draftProfile;
  p.className = document.getElementById('accClass').value.trim().slice(0, 24);
  p.voice = document.getElementById('accVoice').value.trim().slice(0, 240);
  if (!p.platforms.length) p.platforms = ['mp'];
  state.profile = clone(p);
  state.draftProfile = clone(p);
  localSet('bjcm-profile-v1', state.profile);
  updateChrome();
  toast('已保存在这台浏览器');
}
function addSnip() {
  const title = document.getElementById('snipTitle').value.trim().slice(0, 24);
  const text = document.getElementById('snipText').value.trim().slice(0, 400);
  if (!text) { toast('先写片段内容'); return; }
  state.snips.unshift({id: uid(), title: title || '未命名', text: text, at: Date.now()});
  state.snips = state.snips.slice(0, 80);
  localSet('bjcm-snips-v1', state.snips);
  render();
  toast('已保存片段');
}
function onClick(e) {
  const el = e.target.closest('[data-go],[data-choice],[data-act]');
  if (!el) return;
  if (el.dataset.act === 'menu') { toggleMenu(); return; }
  if (el.dataset.act === 'closemenu') { closeMenu(); return; }
  if (el.dataset.choice) { onChoice(el); return; }
  const act = el.dataset.act;
  if (!act && el.dataset.go) { go(el.dataset.go); return; }
  if (act === 'fresh') go('chat', {fresh:true});
  else if (act === 'generate') generate();
  else if (act === 'copy') {
    if (!state.article) toast('先生成一篇再复制');
    else copyText(plain(state.article), '已复制全文');
  } else if (act === 'save') saveDraft();
  else if (act === 'tpl') {
    const t = TPLS.find(x => x.id === el.dataset.id);
    if (!t) return;
    state.mode = t.mode;
    state.topic = t.topic;
    state.article = null;
    if (t.mode === 'cover') state.cover.title = '我们班这一周';
    render();
    const ta = document.getElementById('topic');
    if (ta) ta.focus();
    persistSession();
    toast('已填好模式和选题');
  } else if (act === 'example') {
    state.topic = el.dataset.topic || '';
    render();
    persistSession();
  } else if (act === 'week') {
    const themeBox = document.getElementById('theme');
    if (themeBox) state.theme = themeBox.value.trim().slice(0, 40);
    state.weekTouched = true;
    state.plan = {grade: state.wGrade, platform: state.wPlat, theme: state.theme, days: weekPlan(state.wGrade, state.wPlat, state.theme)};
    render();
    persistSession();
    toast('已生成本周选题');
  } else if (act === 'copyweek') {
    if (!state.plan) return;
    const text = state.plan.days.map(d => d.day + ' · ' + d.slot + '\n' + d.title + '\n' + d.angle + '\n建议功能：' + modeName(d.mode)).join('\n\n');
    copyText(text, '已复制整周计划');
  } else if (act === 'useday') {
    const day = state.plan && state.plan.days[Number(el.dataset.i)];
    if (!day) return;
    state.topic = day.topic;
    state.mode = day.mode;
    state.grade = state.plan.grade;
    state.platform = state.plan.platform;
    state.article = null;
    go('chat');
    toast('已填入创作台，点生成即可');
  } else if (act === 'hot') {
    const item = HOTS.find(x => x.id === el.dataset.id);
    if (!item) return;
    const grade = (state.radar !== 'all' && item.grades.indexOf(state.radar) >= 0) ? state.radar : (item.grades.indexOf(state.grade) >= 0 ? state.grade : item.grades[0]);
    state.grade = grade;
    state.mode = item.mode;
    state.topic = item.topic;
    state.article = null;
    go('chat');
    toast('已填入创作台 · 这是本地示例选题');
  } else if (act === 'tab') {
    state.libTab = el.dataset.tab === 'snips' ? 'snips' : 'drafts';
    render();
  } else if (act === 'open') openDraft(el.dataset.id);
  else if (act === 'copydraft') {
    const d = state.drafts.find(x => x.id === el.dataset.id);
    if (d) copyText(plain(d), '已复制全文');
  } else if (act === 'del') {
    if (!armDelete(el, '删除')) return;
    state.drafts = state.drafts.filter(d => d.id !== el.dataset.id);
    localSet('bjcm-drafts-v1', state.drafts);
    updateChrome();
    paintList();
    toast('已删除');
  } else if (act === 'usesnip') {
    const s = state.snips.find(x => x.id === el.dataset.id);
    if (!s) return;
    state.topic = state.topic ? (state.topic.trim() + '\n' + s.text) : s.text;
    go('chat');
    toast('已放入选题框');
  } else if (act === 'copysnip') {
    const s = state.snips.find(x => x.id === el.dataset.id);
    if (s) copyText((s.title ? s.title + '\n' : '') + s.text, '已复制片段');
  } else if (act === 'delsnip') {
    if (!armDelete(el, '删除')) return;
    state.snips = state.snips.filter(s => s.id !== el.dataset.id);
    localSet('bjcm-snips-v1', state.snips);
    paintList();
    toast('已删除');
  } else if (act === 'restoresnip') {
    const have = new Set(state.snips.map(s => s.id));
    PRESETS.forEach(p => { if (!have.has(p.id)) state.snips.push(Object.assign({at:0, preset:true}, p)); });
    localSet('bjcm-snips-v1', state.snips);
    render();
    toast('已补回示例片段');
  } else if (act === 'synccover') syncCover();
  else if (act === 'download') downloadCover();
  else if (act === 'copypack') copyPack(el.dataset.part, el.dataset.plat);
  else if (act === 'resetprofile') {
    state.draftProfile = clone(DEFAULT_PROFILE);
    render();
    toast('已填回示例，点保存才会写入本机');
  }
}
function onInput(e) {
  const t = e.target;
  if (t.id === 'topic') { state.topic = t.value; persistSession(); }
  else if (t.id === 'theme') state.theme = t.value;
  else if (t.id === 'q') { state.q = t.value; paintList(); }
  else if (t.dataset.cover) { state.cover[t.dataset.cover] = t.value; drawAll(); persistSession(); }
  else if (t.id === 'accClass' && state.draftProfile) state.draftProfile.className = t.value;
  else if (t.id === 'accVoice' && state.draftProfile) state.draftProfile.voice = t.value;
}
function onChange(e) {
  if (!e.target.dataset.check) return;
  const key = checkKey();
  if (!key) return;
  state.checks[key] = state.checks[key] || {};
  state.checks[key][e.target.dataset.check] = e.target.checked;
  const keys = Object.keys(state.checks);
  if (keys.length > 30) keys.slice(0, keys.length - 30).forEach(k => { delete state.checks[k]; });
  localSet('bjcm-checks-v1', state.checks);
  const prog = document.getElementById('prog');
  if (prog) {
    const done = CHECKS.filter(c => state.checks[key][c[0]]).length;
    prog.textContent = '已核对 ' + done + ' / ' + CHECKS.length;
  }
}
function onSubmit(e) {
  if (e.target.id === 'accForm') { e.preventDefault(); saveProfile(); }
  if (e.target.id === 'snipForm') { e.preventDefault(); addSnip(); }
}
function onKey(e) {
  if (e.key === 'Escape') closeMenu();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && state.view === 'chat') {
    e.preventDefault();
    generate();
  }
}
function init() {
  state.profile = loadProfile();
  state.draftProfile = clone(state.profile);
  state.drafts = loadDrafts();
  state.snips = loadSnips();
  state.checks = localGet('bjcm-checks-v1', {}) || {};
  state.grade = state.profile.grade;
  state.platform = state.profile.platforms[0] || 'mp';
  state.wGrade = state.grade;
  state.wPlat = state.platform;
  state.cover = defaultCover();
  restoreSession();
  document.body.addEventListener('click', onClick);
  document.body.addEventListener('input', onInput);
  document.body.addEventListener('change', onChange);
  document.body.addEventListener('submit', onSubmit);
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', syncLayout);
  syncLayout();
  window.addEventListener('hashchange', () => {
    if (suppressHash) return;
    const v = location.hash.replace('#', '');
    if (VIEWS.indexOf(v) < 0 || v === state.view) return;
    showView(v);
  });
  const hv = location.hash.replace('#', '');
  if (VIEWS.indexOf(hv) < 0) {
    suppressHash = true;
    location.hash = 'chat';
    suppressHash = false;
    showView('chat');
  } else showView(hv);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
  window.BJCM = {buildArticle: buildArticle, weekPlan: weekPlan, getState: () => state};
}
init();
</script>
