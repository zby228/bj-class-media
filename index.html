<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="北京高中班级新媒体工作台：素材、一稿多投、热点样本、违禁词、配图、草稿和发布助手。纯静态演示，不登录、不代发。" />
<meta name="theme-color" content="#FDF8EF" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23F2762E'/%3E%3C/svg%3E" />
<title>北京高中班级新媒体工作台</title>
<style>
:root{
  --bg1:#FDF8EF; --bg2:#F7EFDD; --bg3:#EAF3EC;
  --card:#fff; --ink:#3D3A34; --muted:#8A857B; --line:#EFE7D8;
  --orange:#F2762E; --orange-soft:#FDEBDD; --orange-line:#F6CFAF;
  --green:#3E9B6C; --green-soft:#E4F2E9;
  --shadow:0 2px 14px rgba(120,100,70,.06);
  --side:232px;
  --font:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","WenQuanYi Micro Hei","Droid Sans Fallback",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 46%,var(--bg3));font-size:16px;line-height:1.55;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;z-index:80}
.skip:focus{left:8px}
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 12px;z-index:30}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.dot{width:40px;height:40px;border-radius:12px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.logo b{display:block;font-size:15px}
.logo small{color:var(--muted);font-size:12px}
#nav{display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px 12px;color:#6B6459;min-height:44px}
.nav-item.active{background:var(--orange-soft);color:var(--orange);font-weight:700}
.nav-item .ic{width:1.4em;text-align:center}
.badge{margin-left:auto;background:#fff;color:var(--orange);border-radius:99px;padding:0 7px;font-size:12px}
.side-foot{margin-top:auto;display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:rgba(255,255,255,.7);border-radius:14px;padding:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:#EAD9BE;display:grid;place-items:center;font-weight:700;flex:none}
.side-foot small{display:block;color:var(--muted);font-size:12px}
.main{margin-left:var(--side);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(253,248,239,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto}
#crumb{font-weight:700}
.grow{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;min-height:44px}
.who,.ghost,.btn{border-radius:999px}
.who{border:1px solid var(--line);background:#fff;padding:8px 12px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-pill{border:1px solid var(--orange-line);background:var(--orange-soft);color:#9A3412;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
#mask{display:none;position:fixed;inset:0;border:0;background:rgba(61,58,52,.4);z-index:25}
#view{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:18px 0 56px}
h2{margin:0 0 8px;font-size:1.45rem;scroll-margin-top:72px}
.lead,.hint{color:var(--muted)}
.hint{font-size:.88rem;margin:6px 0}
.card,.pack-card,.hot-col,.lf-card,.lib,.skill{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card{padding:16px}
.card + .card,.block{margin-top:14px}
.label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:#FBF7EE;border-radius:999px;padding:8px 12px;color:#6B6459}
.pill.on{background:var(--orange-soft);border-color:var(--orange-line);color:var(--orange);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > input,.row > select{flex:1;min-width:180px}
input[type="text"],input[type="url"],input[type="search"],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
textarea{min-height:120px;resize:vertical;line-height:1.6}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--orange);color:#fff;border:0;padding:10px 16px;min-height:44px;font-weight:700;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tiny{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:.82rem;white-space:nowrap}
.banner{background:var(--orange-soft);border:1px solid var(--orange-line);color:#7C3F1D;border-radius:14px;padding:12px 14px;margin:0 0 12px}
.banner.green{background:var(--green-soft);border-color:#CDE4D0;color:#246B45}
.banner.bad{background:#FDE8E4;border-color:#F3C2BA;color:#9F2D20}
.demo{display:inline-flex;align-items:center;border-radius:99px;background:#fff;color:#C2410C;font-size:11px;font-weight:800;padding:2px 8px;border:1px solid var(--orange-line)}
.stepper{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stepper button{border:1px dashed var(--orange-line);background:#fff;border-radius:999px;padding:8px 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.jump,.cardbtn{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;color:inherit;width:100%}
.jump b,.cardbtn strong{display:block}
.jump span,.cardbtn span,.k{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.slots i{display:grid;place-items:center;min-height:64px;border-radius:12px;background:#FAF4E8;color:var(--muted);font-style:normal;font-size:12px;text-align:center;padding:6px}
.pack-card{padding:14px;margin-top:12px}
.pack-card h3{margin:0 0 6px;font-size:1.05rem}
.body{white-space:pre-wrap;line-height:1.7;background:#FDFBF6;border-radius:12px;padding:10px 12px;max-height:280px;overflow:auto}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{background:#F5F0E8;border-radius:8px;padding:3px 8px;font-size:.78rem}
.steps{margin:8px 0;padding-left:1.2em}
.steps li{margin:6px 0}
.hot-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hot-col{padding:12px;min-width:0}
.hot-col header{display:flex;align-items:center;gap:6px;justify-content:space-between}
.hot-col .sub{color:var(--muted);font-size:12px;margin:4px 0 8px}
.hot-list{max-height:480px;overflow:auto}
.h-item{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px}
.h-item:hover{background:var(--orange-soft)}
.h-item .no{font-weight:800;color:#C9BEA9;width:1.4em;flex:none}
.h-item:nth-child(-n+3) .no{color:var(--orange)}
.h-item b{display:block;font-size:.92rem}
.lf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lf-card{overflow:hidden}
.lf-cover{min-height:96px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#3D3A34}
.lf-cover b{font-size:1.05rem;line-height:1.35;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.lf-body{padding:12px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;font-size:12px;color:#6B6459}
.stats b{color:var(--ink);font-weight:700}
.empty{padding:22px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.lib,.skill{padding:12px 14px;margin-top:10px}
.skill{display:flex;gap:10px;align-items:flex-start}
.skill .si{width:36px;height:36px;border-radius:10px;background:var(--orange-soft);display:grid;place-items:center;flex:none}
.draft-ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.risk{display:inline-block;border-radius:999px;padding:4px 10px;font-weight:800;font-size:.85rem}
.risk-low{background:var(--green-soft);color:#246B45}
.risk-mid{background:#FFF4D8;color:#8A5A10}
.risk-high{background:#FDE8E4;color:#9F2D20}
.hit{display:inline-block;margin:4px 6px 0 0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:.82rem}
.pg{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#FDFBF6}
.frame{width:min(100%,280px)}
.frame canvas{width:100%;height:auto;border-radius:16px;display:block;box-shadow:var(--shadow)}
.check{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.check input{margin-top:4px;width:18px;height:18px}
.foot-note{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3D3A34;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
body.nav-open{overflow:hidden}
@media (max-width:960px){
  .hot-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  #side{left:-280px;width:min(280px,88vw);transition:left .2s ease}
  #side.open{left:0}
  .main{margin-left:0}
  .menu-btn{display:inline-flex}
  #mask.show{display:block}
  .hot-list{max-height:none}
}
@media (max-width:640px){
  .hot-grid,.slots{grid-template-columns:1fr}
  .demo-pill{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#view">跳到内容</a>
<div class="app">
  <aside id="side" aria-label="工作台导航">
    <div class="logo">
      <div class="dot" aria-hidden="true">班</div>
      <div>
        <b>班级新媒体</b>
        <small>北京高中 · 工作台</small>
      </div>
    </div>
    <nav id="nav">
      <button type="button" class="nav-item" data-go="intake"><span class="ic" aria-hidden="true">✎</span>素材入口</button>
      <button type="button" class="nav-item" data-go="pack"><span class="ic" aria-hidden="true">⇄</span>一稿多投</button>
      <button type="button" class="nav-item" data-go="hot"><span class="ic" aria-hidden="true">◎</span>热点雷达</button>
      <button type="button" class="nav-item" data-go="check"><span class="ic" aria-hidden="true">检</span>违禁词</button>
      <button type="button" class="nav-item" data-go="cover"><span class="ic" aria-hidden="true">图</span>做配图</button>
      <button type="button" class="nav-item" data-go="drafts"><span class="ic" aria-hidden="true">稿</span>草稿箱<span class="badge" id="draftBadge" hidden></span></button>
      <button type="button" class="nav-item" data-go="publish"><span class="ic" aria-hidden="true">发</span>发布助手</button>
      <button type="button" class="nav-item" data-go="account"><span class="ic" aria-hidden="true">我</span>账号空间</button>
      <button type="button" class="nav-item" data-go="tools"><span class="ic" aria-hidden="true">具</span>工具&技能</button>
    </nav>
    <button type="button" class="side-foot" data-go="account">
      <span class="avatar" id="avatar">班</span>
      <span><strong id="footName">未填写班级</strong><small id="footMeta">本地</small></span>
    </button>
  </aside>
  <button type="button" id="mask" data-act="closemenu" aria-label="关闭导航"></button>
  <div class="main">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menuBtn" data-act="menu">菜单</button>
      <strong id="crumb">素材入口</strong>
      <span class="grow"></span>
      <span class="demo-pill">静态演示 · 无接口</span>
      <button type="button" class="tiny" data-act="fresh">清空素材</button>
      <button type="button" class="who" id="who" data-go="account">设置班级</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">请开启 JavaScript。页面是纯静态文件，生成和筛选都在浏览器里完成。</p></noscript>
<script src="workbench.js"></script>
<script>
var VIEWS = [
  ['intake', '素材入口'], ['pack', '一稿多投'], ['hot', '热点雷达'], ['check', '违禁词'],
  ['cover', '做配图'], ['drafts', '草稿箱'], ['publish', '发布助手'], ['account', '账号空间'], ['tools', '工具&技能']
];
var LEGACY = {chat:'intake', workshop:'hot', radar:'hot', library:'drafts', home:'intake', space:'account', kb:'drafts'};
var LOOP = [['intake','1 素材'], ['pack','2 一稿多投'], ['check','3 审核'], ['cover','4 配图'], ['drafts','5 草稿'], ['publish','6 人工发布']];
var FANS_OPTS = [['1000','粉丝 ≤ 1000'], ['5000','粉丝 ≤ 5000'], ['20000','粉丝 ≤ 2万'], ['0','全部样本']];
var ACT_OPTS = [['0','互动不限'], ['1000','互动 ≥ 1000'], ['5000','互动 ≥ 5000'], ['20000','互动 ≥ 2万']];
var PLAT_GUESS = ['小红书','公众号','抖音','视频号','B站','快手','未识别'];
var PROFILE_KEY = 'bjcm-profile-v2';
var DRAFT_KEY = 'bjcm-drafts-v2';
var WORD_KEY = 'bjcm-words-v2';
var SESSION_KEY = 'bjcm-session-v2';
var DEFAULT_PROFILE = {className:'', grade:'g1', platforms:['xhs','sph','dy','mp'], voice:'具体、温暖，像班刊。少鸡汤，不晒成绩，不导流。'};
var HOT_META = {
  xhs: ['小红书', '点一条填入素材 · 非实时'],
  dy: ['抖音', '点一条填入素材 · 非实时'],
  sph: ['视频号', '点一条填入素材 · 非实时'],
  mp: ['公众号', '点一条填入素材 · 非实时']
};

var state = {
  view: 'intake',
  source: null,
  grade: 'g1',
  targets: null,
  pack: null,
  packKey: '',
  audit: null,
  checkText: '',
  checkResult: null,
  hotMode: 'fit',
  hotQ: '',
  lf: {maxFans:5000, minAct:0, grade:'all', kw:''},
  weekGrade: 'g1',
  weekTheme: '',
  coverTitle: '',
  publishLog: {},
  checks: {},
  profile: null,
  drafts: [],
  words: [],
  menuOpen: false
};
var suppressHash = false;
var toastTimer = 0;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function localGet(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function localSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { toast('这台浏览器无法保存，本次仍可使用'); }
}
function defaultSource() {
  return {kind:'link', url:'', platform:'小红书', title:'', author:'', content:'', demo:false, parsed:false, note:'', images:[]};
}
function defaultTargets() {
  var o = {};
  BJCM.TARGETS.forEach(function (t) { o[t.id] = true; });
  return o;
}
function loadProfile() {
  var saved = localGet(PROFILE_KEY, null);
  if (!saved) {
    var old = localGet('bjcm-profile-v1', null);
    if (old && typeof old === 'object') {
      var map = {douyin:'dy', channels:'sph', mp:'mp', kuaishou:'ks', bilibili:'bili', xhs:'xhs'};
      saved = {
        className: old.className || '',
        grade: old.grade || 'g1',
        voice: old.voice || DEFAULT_PROFILE.voice,
        platforms: (old.platforms || []).map(function (id) { return map[id] || id; })
      };
    }
  }
  var p = Object.assign({}, DEFAULT_PROFILE, saved || {});
  if (!BJCM.GRADES.some(function (g) { return g.id === p.grade; })) p.grade = 'g1';
  var known = BJCM.PLATFORMS.map(function (x) { return x.id; });
  p.platforms = (Array.isArray(p.platforms) ? p.platforms : []).filter(function (id) { return known.indexOf(id) >= 0; });
  if (!p.platforms.length) p.platforms = DEFAULT_PROFILE.platforms.slice();
  p.className = String(p.className || '').slice(0, 24);
  p.voice = String(p.voice == null ? DEFAULT_PROFILE.voice : p.voice).slice(0, 240);
  return p;
}
function loadDrafts() {
  var arr = localGet(DRAFT_KEY, null);
  if (arr == null) {
    var old = localGet('bjcm-drafts-v1', []);
    arr = Array.isArray(old) ? old.filter(function (d) { return d && d.title; }).map(function (d) {
      return {
        id: d.id || uid(), at: d.at || 0, title: d.title, grade: d.grade || 'g1', legacy: true, pack: null,
        source: {kind:'text', url:'', platform:'公众号', title:d.title, author:'旧版草稿', content:d.body || d.content || '', demo:false, parsed:true, note:'从上一版知识库导入', images:[]}
      };
    }) : [];
  }
  return Array.isArray(arr) ? arr.filter(function (d) { return d && d.id; }).slice(0, 40) : [];
}
function loadWords() {
  var arr = localGet(WORD_KEY, []);
  return Array.isArray(arr) ? arr.map(function (w) { return String(w || '').trim(); }).filter(function (w) { return w.length >= 2 && w.length <= 12; }).slice(0, 40) : [];
}
function sourceKey() {
  var flags = BJCM.TARGETS.map(function (t) { return state.targets[t.id] ? '1' : '0'; }).join('');
  return [state.source.title, state.source.content, state.grade, state.profile.className, state.profile.voice, flags].join('\u0001');
}
function persist() {
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      view: state.view, source: state.source, grade: state.grade, targets: state.targets,
      pack: state.pack, packKey: state.packKey, audit: state.audit, checkText: state.checkText,
      checkResult: state.checkResult, hotMode: state.hotMode, hotQ: state.hotQ, lf: state.lf,
      weekGrade: state.weekGrade, weekTheme: state.weekTheme, coverTitle: state.coverTitle,
      publishLog: state.publishLog, checks: state.checks
    }));
  } catch (e) {}
}
function restoreSession() {
  var data = null;
  try { data = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { data = null; }
  if (!data || typeof data !== 'object') return;
  if (data.source && typeof data.source === 'object') state.source = Object.assign(defaultSource(), data.source);
  if (BJCM.GRADES.some(function (g) { return g.id === data.grade; })) state.grade = data.grade;
  if (data.targets && typeof data.targets === 'object') state.targets = Object.assign(defaultTargets(), data.targets);
  if (data.pack && typeof data.pack === 'object') state.pack = data.pack;
  if (typeof data.packKey === 'string') state.packKey = data.packKey;
  if (data.audit) state.audit = data.audit;
  if (typeof data.checkText === 'string') state.checkText = data.checkText;
  if (data.checkResult) state.checkResult = data.checkResult;
  if (data.hotMode === 'fit' || data.hotMode === 'all') state.hotMode = data.hotMode;
  if (typeof data.hotQ === 'string') state.hotQ = data.hotQ.slice(0, 40);
  if (data.lf && typeof data.lf === 'object') state.lf = Object.assign({maxFans:5000, minAct:0, grade:'all', kw:''}, data.lf);
  if (BJCM.GRADES.some(function (g) { return g.id === data.weekGrade; })) state.weekGrade = data.weekGrade;
  if (typeof data.weekTheme === 'string') state.weekTheme = data.weekTheme.slice(0, 40);
  if (typeof data.coverTitle === 'string') state.coverTitle = data.coverTitle.slice(0, 24);
  if (data.publishLog && typeof data.publishLog === 'object') state.publishLog = data.publishLog;
  if (data.checks && typeof data.checks === 'object') state.checks = data.checks;
  if (VIEWS.some(function (v) { return v[0] === data.view; })) state.view = data.view;
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');

    var next = line + ch;
    if (line && ctx.measureText(next).width > max) { lines.push(line); line = ch; }
    else line = next;
  });
  if (line) lines.push(line);
  return lines;
}
function downloadCover() {
  paintCover();
  var canvas = document.getElementById('cover-canvas');
  if (!canvas) return;
  var a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = '班级封面.png';
  a.click();
  toast('已下载 PNG，图片只在本地');
}
function fresh() {
  state.source = defaultSource();
  state.pack = null;
  state.packKey = '';
  state.audit = null;
  state.checkText = '';
  state.checkResult = null;
  state.coverTitle = '';
  state.publishLog = {};
  go('intake');
  toast('已清空当前素材');
}
function onClick(e) {
  var el = e.target.closest('[data-act],[data-go]');
  if (!el) return;
  var act = el.dataset.act;
  var dest = el.dataset.go;
  if (act === 'mark-open') {
    var oid = el.dataset.id;
    state.publishLog[oid] = state.publishLog[oid] || {};
    state.publishLog[oid].opened = true;
    var note = document.getElementById('pub-note-' + oid);
    if (note) note.textContent = pubStatus(oid);
    persist();
    toast('链接已打开。请自己粘贴，并亲自点发布');
    return;
  }
  if (dest && !act) { go(dest); return; }
  if (act === 'menu') { setMenu(true); return; }
  if (act === 'closemenu') { setMenu(false); return; }
  if (act === 'fresh') { fresh(); return; }
  if (act === 'kind') { state.source.kind = el.dataset.id === 'text' ? 'text' : 'link'; render(); return; }
  if (act === 'grade') { state.grade = el.dataset.id; render(); return; }
  if (act === 'target') {
    state.targets[el.dataset.id] = !state.targets[el.dataset.id];
    if (!selectedTargets().length) { state.targets[el.dataset.id] = true; toast('至少留一个渠道'); return; }
    render();
    return;
  }
  if (act === 'parse') { runParse(); return; }
  if (act === 'generate') { generate(); return; }
  if (act === 'to-pack') { syncDom(); go('pack'); return; }
  if (act === 'example') {
    state.source.kind = 'text';
    state.source.title = el.dataset.topic || '';
    state.source.content = '现场：' + (el.dataset.topic || '') + '。请补上你们班真正发生的一句原话。时间地点以班主任通知为准。';
    state.source.author = '示例选题';
    state.source.demo = true;
    state.source.parsed = true;
    state.source.note = '示例选题，不是链接解析。';
    state.source.platform = '小红书';
    render();
    return;
  }
  if (act === 'save-draft') { saveDraft(); return; }
  if (act === 'load-draft') { loadDraft(el.dataset.id); return; }
  if (act === 'del-draft') { delDraft(el.dataset.id); return; }
  if (act === 'copy-ch') {
    var part = el.dataset.part;
    var text = channelText(el.dataset.id, part);
    if (part === 'tags' && !text) { toast('这一版没有话题'); return; }
    if (part === 'title' && !text) { toast('这一版没有单独标题'); return; }
    copyText(text, '已复制。请到平台粘贴后自己点发布', function () { markCopied(el.dataset.id); });
    return;
  }
  if (act === 'check-run') { runCheck(); return; }
  if (act === 'load-pack-text') {
    if (!state.pack) { toast('还没有五版文案'); return; }
    state.checkText = packPlain();
    render();
    return;
  }
  if (act === 'add-word') { addWord(); return; }
  if (act === 'del-word') {
    state.words.splice(Number(el.dataset.i), 1);
    localSet(WORD_KEY, state.words);
    render();
    return;
  }
  if (act === 'download-cover') { downloadCover(); return; }
  if (act === 'copy-prompt') {
    var page = currentOutline()[Number(el.dataset.i)];
    if (page) copyText(page.prompt, '已复制提示词');
    return;
  }
  if (act === 'use-hot') { useHot(el.dataset.col, Number(el.dataset.i)); return; }
  if (act === 'use-low') { useLow(el.dataset.id); return; }
  if (act === 'use-week') { useWeek(Number(el.dataset.i)); return; }
  if (act === 'hot-mode') { state.hotMode = el.dataset.id === 'all' ? 'all' : 'fit'; render(); return; }
  if (act === 'lf-fans') { state.lf.maxFans = Number(el.dataset.id); render(); return; }
  if (act === 'lf-min') { state.lf.minAct = Number(el.dataset.id); render(); return; }
  if (act === 'lf-grade') { state.lf.grade = el.dataset.id; render(); return; }
  if (act === 'week-grade') { state.weekGrade = el.dataset.id; render(); return; }
  if (act === 'repaint') { syncDom(); render(); return; }
  if (act === 'pf-plat') {
    var id = el.dataset.id;
    var arr = state.profile.platforms.slice();
    var at = arr.indexOf(id);
    if (at >= 0) arr.splice(at, 1);
    else arr.push(id);
    if (!arr.length) { toast('至少留一个常用平台'); return; }
    state.profile.platforms = arr;
    localSet(PROFILE_KEY, state.profile);
    render();
    return;
  }
  if (act === 'save-profile') { saveProfile(); return; }
  if (act === 'apply-grade') {
    state.grade = state.profile.grade;
    render();
    toast('当前稿已改成' + BJCM.gradeById(state.grade).label);
    return;
  }
  if (act === 'copy-skill') {
    var skill = null;
    BJCM.SKILLS.forEach(function (s) { if (s.id === el.dataset.id) skill = s; });
    if (skill) copyText(skill.title + '\n' + skill.text, '已复制技能卡');
  }
}
function onInput(e) {
  var t = e.target;
  if (t.id === 'src-url') state.source.url = t.value;
  if (t.id === 'src-title' || t.id === 'pack-title') state.source.title = t.value;
  if (t.id === 'src-author') state.source.author = t.value;
  if (t.id === 'src-body' || t.id === 'pack-body') state.source.content = t.value;
  if (t.id === 'check-text') state.checkText = t.value;
  if (t.id === 'hot-q') { state.hotQ = t.value.slice(0, 40); paintHot(); paintLow(); }
  if (t.id === 'week-theme') { state.weekTheme = t.value.slice(0, 40); paintWeek(); }
  if (t.id === 'pf-class') { state.profile.className = t.value.slice(0, 24); updateChrome(); }
  if (t.id === 'pf-voice') state.profile.voice = t.value.slice(0, 240);
  if (t.id === 'cover-title') { state.coverTitle = t.value.slice(0, 24); paintCover(); refreshOutlineText(); }
  refreshStale();
  persist();
}
function boot() {
  if (!window.BJCM) {
    document.getElementById('view').innerHTML = '<p>页面脚本没有载入。请确认 workbench.js 和 index.html 在同一目录。</p>';
    return;
  }
  state.source = defaultSource();
  state.targets = defaultTargets();
  state.profile = loadProfile();
  state.drafts = loadDrafts();
  state.words = loadWords();
  state.grade = state.profile.grade;
  state.weekGrade = state.profile.grade;
  restoreSession();
  var fromHash = normalizeHash(location.hash);
  if (fromHash) state.view = fromHash;
  if (location.hash !== '#' + state.view) {
    suppressHash = true;
    location.replace('#' + state.view);
  }
  document.body.addEventListener('click', onClick);
  document.body.addEventListener('input', onInput);
  document.body.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'src-platform') state.source.platform = t.value;
    if (t.id === 'pf-grade') { state.profile.grade = t.value; localSet(PROFILE_KEY, state.profile); updateChrome(); }
    if (t.id === 'lf-kw') { state.lf.kw = t.value; paintLow(); persist(); }
    if (t.classList && t.classList.contains('chk')) { state.checks[t.dataset.id] = t.checked; persist(); }
  });
  document.body.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'src-url') { e.preventDefault(); runParse(); }
    if (e.key === 'Enter' && e.target.id === 'word-in') { e.preventDefault(); addWord(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && (state.view === 'intake' || state.view === 'pack')) {
      e.preventDefault();
      generate();
    }
  });
  window.addEventListener('hashchange', function () {
    if (suppressHash) { suppressHash = false; return; }
    var v = normalizeHash(location.hash);
    if (!v) return;
    state.view = v;
    setMenu(false);
    render();
  });
  render();
}
boot();
</script>
</body>
</html>
